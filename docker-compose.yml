services:
  stream247:
    build: .
    container_name: stream247-panel
    restart: unless-stopped
    ports:
      - "28081:8080"
    environment:
      - TZ=Asia/Baghdad
      - DATA_DIR=/data
      # اختياري: فعل حماية اللوحة بكلمة مرور
      # - ADMIN_USER=admin
      # - ADMIN_PASSWORD=change-me-now
    volumes:
      - ./data:/data
